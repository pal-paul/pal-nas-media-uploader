name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image configuration
        id: image-config
        shell: bash
        run: |
          set -a
          source .env.example
          set +a
          {
            echo "go_image=$GO_IMAGE"
            echo "runtime_image=$RUNTIME_IMAGE"
            echo "media_dir=$ENV_MEDIA_DIR"
            echo "tmp_dir=$ENV_TMP_DIR"
            echo "port=$ENV_PORT"
          } >> "$GITHUB_OUTPUT"

      - id: uploader-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GO_IMAGE=${{ steps.image-config.outputs.go_image }}
            RUNTIME_IMAGE=${{ steps.image-config.outputs.runtime_image }}
            ENV_MEDIA_DIR=${{ steps.image-config.outputs.media_dir }}
            ENV_TMP_DIR=${{ steps.image-config.outputs.tmp_dir }}
            ENV_PORT=${{ steps.image-config.outputs.port }}
          cache-from: type=gha,scope=container-image
          cache-to: type=gha,mode=max,scope=container-image
          tags: ${{ steps.uploader-metadata.outputs.tags }}
          labels: ${{ steps.uploader-metadata.outputs.labels }}
