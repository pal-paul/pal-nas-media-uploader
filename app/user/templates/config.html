<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>User configuration</title><style>
:root{font-family:Georgia,serif;color:#17221c;background:#eef1e8}body{max-width:960px;margin:0 auto;padding:32px}h1{font-size:2rem}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:#fff;border:1px solid #b8c1b7;padding:24px}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #738078;border-radius:4px}button{margin-top:16px;background:#174b35;color:white;cursor:pointer}li{padding:8px 0;border-bottom:1px solid #ddd}img{max-width:220px}@media(max-width:700px){main{grid-template-columns:1fr}body{padding:18px}}
</style></head><body><h1>User configuration</h1><main><section><h2>Create account</h2><form id="create"><label>Username</label><input name="username" required><label>Password</label><input name="password" type="password" minlength="12" required><label>Role</label><select name="role"><option value="user">Regular user</option><option value="admin">Administrator</option></select><label>Upload folder</label><input name="uploadFolder" placeholder="team/alex"><button>Create user</button></form><div id="setup"></div></section><section><h2>Users</h2><ul id="users"></ul></section></main><script>
const users=document.querySelector('#users'),setup=document.querySelector('#setup');async function load(){const r=await fetch('/admin/users');const data=await r.json();users.replaceChildren(...data.map(u=>{const item=document.createElement('li'),name=document.createElement('strong');name.textContent=u.username;item.append(name,document.createTextNode(` - ${u.role}${u.uploadFolder?' - '+u.uploadFolder:''}`));return item}))}load();document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){setup.textContent=data.error||'Request failed';return}const title=document.createElement('h3'),image=document.createElement('img'),note=document.createElement('p');title.textContent=`Scan 2FA for ${data.user.username}`;image.src=data.qrCode;image.alt='TOTP QR code';note.textContent='Save this now. It is shown once.';setup.replaceChildren(title,image,note);e.target.reset();load()};
</script></body></html>
