<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAL Media</title><style>
:root{font-family:"Avenir Next",Avenir,sans-serif;color:#18231e;background:#e8ece5;--ink:#18231e;--green:#176647;--paper:#fff;--line:#bcc7bd;--warn:#a4432f}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,52px);background:#18362a;color:white}header h1{font-family:Georgia,serif;font-size:1.65rem;margin:0;letter-spacing:0}header nav{display:flex;gap:8px}button,.button,input,select{font:inherit;border:1px solid #738078;border-radius:4px;padding:9px 12px}.button,button{background:var(--green);color:white;cursor:pointer;text-decoration:none}button.secondary,.button.secondary{background:white;color:var(--ink)}main{max-width:1240px;margin:auto;padding:28px clamp(16px,4vw,48px)}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;align-items:center;margin-bottom:18px}.upload{border:2px dashed #769181;background:#f8faf7;padding:22px;margin-bottom:24px}.upload h2{font:1.35rem Georgia,serif;margin:0 0 12px}.upload-row{display:grid;grid-template-columns:1fr auto;gap:12px}.progress{height:8px;background:#d6ddd7;margin-top:14px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#dfb128;transition:width .2s}.status{min-height:24px;margin:8px 0;color:#405047}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.media{background:var(--paper);border:1px solid var(--line);padding:10px;min-width:0}.media img,.placeholder{width:100%;aspect-ratio:4/3;object-fit:cover;background:#dfe5de;display:grid;place-items:center}.media h3{font:600 .95rem/1.25 inherit;margin:9px 0 3px;overflow-wrap:anywhere}.media p{font-size:.8rem;color:#526057;margin:0}.media .actions{display:flex;gap:6px;margin-top:9px}.media button{padding:6px 8px;font-size:.78rem}dialog{border:1px solid var(--line);padding:22px;max-width:430px;width:calc(100% - 32px)}dialog form{display:grid;gap:10px}dialog::backdrop{background:#13241daa}@media(max-width:680px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.upload-row{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><header><h1>PAL Media</h1><nav><button id="recovery" class="secondary">Recovery codes</button><a class="button secondary" href="/media/export">Export</a><button id="logout" class="secondary">Log out</button></nav></header><main>
<section class="upload"><h2>Upload media</h2><div class="upload-row"><input id="files" type="file" multiple accept="image/*,video/*"><button id="upload">Upload selected</button></div><div class="progress"><span id="bar"></span></div><p class="status" id="status"></p></section>
<div class="toolbar"><input id="search" type="search" placeholder="Search media"><select id="kind"><option value="">All media</option><option value="photo">Photos</option><option value="video">Videos</option></select><label class="button secondary">Import<input id="import" type="file" accept="application/json" hidden></label></div><section class="gallery" id="gallery"></section></main>
<dialog id="codes"><form method="dialog"><h2>Recovery codes</h2><pre id="code-list"></pre><button>Close</button></form></dialog><script>
const chunkSize=8*1024*1024,$=s=>document.querySelector(s),status=$('#status'),bar=$('#bar');
async function api(url,options={}){const response=await fetch(url,options);if(!response.ok)throw new Error((await response.json().catch(()=>({}))).error||`Request failed (${response.status})`);return response.status===204?null:response.json()}
async function digest(file){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()))].map(value=>value.toString(16).padStart(2,'0')).join('')}
async function uploadFile(file,batchId,index,total){status.textContent=`Hashing ${file.name}`;const sha256=await digest(file);const check=await api('/media/upload/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sha256})});if(check.duplicate){status.textContent=`Skipped duplicate ${file.name}`;return}const upload=await api('/media/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,mime_type:file.type,size:file.size,sha256,batchId})});for(let part=0;part<upload.chunks;part++){const body=file.slice(part*chunkSize,Math.min(file.size,(part+1)*chunkSize));await api(`/media/upload/${upload.id}/parts/${part}`,{method:'PUT',body});bar.style.width=`${((index+(part+1)/upload.chunks)/total)*100}%`}await api(`/media/upload/${upload.id}/complete`,{method:'POST'});status.textContent=`Uploaded ${file.name}`}
$('#upload').onclick=async()=>{const files=[...$('#files').files];if(!files.length)return;bar.style.width='0';try{const expectedBytes=files.reduce((sum,file)=>sum+file.size,0);const batch=await api('/media/upload-batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`Upload ${new Date().toLocaleString()}`,expectedFiles:files.length,expectedBytes})});for(let index=0;index<files.length;index++)await uploadFile(files[index],batch.id,index,files.length);status.textContent='Batch complete';await load()}catch(error){status.textContent=error.message}}
function card(item){const article=document.createElement('article');article.className='media';const visual=item.thumbnailUrl?Object.assign(document.createElement('img'),{src:item.thumbnailUrl,alt:''}):Object.assign(document.createElement('div'),{className:'placeholder',textContent:item.kind==='video'?'Video':'Photo'});const title=document.createElement('h3');title.textContent=item.fileName;const detail=document.createElement('p');detail.textContent=[item.ownerUsername,item.width&&item.height?`${item.width} x ${item.height}`:'',item.capturedAt?new Date(item.capturedAt).toLocaleDateString():''].filter(Boolean).join(' | ');const actions=document.createElement('div');actions.className='actions';const download=document.createElement('a');download.className='button';download.textContent='Download';download.href=`/media/files/${item.id}/download`;const share=document.createElement('button');share.textContent='Share';share.onclick=()=>createShare(item.id);actions.append(download,share);article.append(visual,title,detail,actions);return article}
async function load(){try{const query=new URLSearchParams({search:$('#search').value,kind:$('#kind').value});const items=await api(`/media/files?${query}`);$('#gallery').replaceChildren(...items.map(card))}catch(error){status.textContent=error.message}}
async function createShare(mediaId){const password=prompt('Optional password (minimum 8 characters)')||'';try{const link=await api('/media/public-links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mediaId,password,expiresAt:new Date(Date.now()+7*86400000).toISOString()})});await navigator.clipboard.writeText(location.origin+link.url);status.textContent='Public link copied'}catch(error){status.textContent=error.message}}
$('#search').oninput=()=>load();$('#kind').onchange=()=>load();$('#import').onchange=async event=>{try{await api('/media/import',{method:'POST',headers:{'Content-Type':'application/json'},body:await event.target.files[0].text()});status.textContent='Metadata imported';await load()}catch(error){status.textContent=error.message}};$('#recovery').onclick=async()=>{try{const data=await api('/auth/recovery-codes',{method:'POST'});$('#code-list').textContent=data.recoveryCodes.join('\n');$('#codes').showModal()}catch(error){status.textContent=error.message}};$('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
