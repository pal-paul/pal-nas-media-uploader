openapi: 3.1.0
info:
  title: PAL NAS Media Uploader API
  version: 1.0.0
  description: |
    Backend API for a self-hosted, multi-user NAS media library.

    ## Accounts and authorization

    The service has two roles. Administrators manage accounts but cannot use
    upload or gallery routes. Regular users upload into their configured folder,
    organize accessible media, and share owned media with other regular users.
    Resource lookup is scoped by the authenticated identity; inaccessible
    resources generally return `404` instead of revealing their existence.

    The first persistent administrator is created through the one-time HTML
    setup flow. Deployment bootstrap credentials authorize that operation only
    and are never stored as an application account. The initial administrator
    uses password-only login. Every account subsequently created by an
    administrator uses password plus TOTP.

    ## Sessions and browser access

    Authentication produces an opaque, HttpOnly cookie named
    `pal_medias_uploader_session`. Sessions last 30 days. Cross-origin browser
    requests must send credentials and their `Origin` must appear in
    `ENV_CORS_ALLOWED_ORIGINS`; an unlisted origin receives an empty `403`
    response. The cookie is `Secure` for HTTPS requests and uses `SameSite=None`
    only for secure cross-site requests; otherwise it uses `SameSite=Strict`.

    ## Uploads and media

    Upload sessions belong to the user who created them. Parts are zero-indexed
    and use a fixed 8 MiB size except for the final part. Active upload metadata
    and parts are persisted under the temporary directory and are reloaded after
    a process restart. Uploads do not expire automatically. Completion assembles
    parts in order, computes SHA-256, optionally verifies the client checksum,
    atomically moves the file into media storage, and persists the media record.

    Completed media have one owner. Sharing creates an owner-to-recipient library
    grant: the recipient can access all of that owner's current and future active
    media for listing, download, album membership, favorites, storage totals, and
    automatic albums. Sharing never transfers ownership. Favorites are per-user.
    Trashing is owner-only and immediately hides media from recipients; permanent
    deletion removes the physical file and associated database rows.

    ## Albums

    Manual albums are user-owned and may contain owned or shared active media.
    Nightly reconciliation creates system-managed weekly albums from each user's
    complete accessible library, including media received through library shares.
    Dates with more than 15 accessible active items are promoted to a daily album.
    The same media can therefore appear in automatic albums owned by its owner and
    by each recipient. Automatic albums cannot be renamed, deleted, reordered, or
    have membership changed manually.

    ## Runtime configuration

    The backend is configured through environment variables:

    - `ENV_DATABASE_URL` is the required PostgreSQL connection URL.
    - `ENV_ADMIN_USERNAME` and `ENV_ADMIN_PASSWORD` authorize one-time setup;
      the bootstrap password must contain at least 12 characters.
    - `ENV_FRONTEND_PAGES_ENABLED` is `YES` or `NO` and controls only the
      built-in `/setup` and `/admin/config` HTML pages. JSON APIs remain active.
    - `ENV_MEDIA_DIR` and `ENV_TMP_DIR` select completed-media and active-upload
      storage roots.
    - `ENV_MAX_UPLOAD_SIZE_BYTES` defaults to 100 GiB.
    - `ENV_CORS_ALLOWED_ORIGINS` is a comma-separated exact-origin allowlist.
    - `ENV_ISSUER` is displayed by authenticator applications.
    - `ENV_AUTO_ALBUM_RUN_AT` defaults to `02:00`; `ENV_AUTO_ALBUM_TIMEZONE`
      accepts an IANA timezone and defaults to the host's local timezone.

    PostgreSQL stores users, sessions, challenges, completed-media metadata,
    sharing, albums, and preferences. Active upload chunks and their recovery
    metadata are filesystem-backed. Completed files are stored beneath the
    configured media root.
servers:
  - url: http://localhost:{port}
    description: Local Docker Compose environment
    variables:
      port:
        default: "8081"
tags:
  - name: Setup
    description: One-time, bootstrap-authorized creation of the first administrator.
  - name: Authentication
    description: Password verification, TOTP challenges, opaque sessions, and logout.
  - name: Uploads
    description: User-owned resumable upload creation, part transfer, recovery, completion, and cancellation.
  - name: Users
    description: Administrator-only account configuration and regular-user folder management.
  - name: Media
    description: Owned and shared completed media, downloads, and owner-managed sharing.
  - name: Gallery
    description: User-owned albums, personal favorites, trash, and accessible storage totals.
security:
  - sessionCookie: []
paths:
  /setup:
    get:
      tags: [Setup]
      operationId: initialSetupPage
      summary: Open one-time administrator setup
      description: |
        Renders an embedded HTML form. The route is available only while
        `ENV_FRONTEND_PAGES_ENABLED=YES` and the users table is empty. It returns
        `404` after any account exists, so setup completion requires no separate
        state flag.
      security: []
      responses:
        "200":
          description: Initial administrator setup HTML page.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Setup is complete or frontend pages are disabled.
    post:
      tags: [Setup]
      operationId: createInitialAdministrator
      summary: Create the first persistent administrator
      description: |
        Accepts a form body of at most 64 KiB. Bootstrap credentials are compared
        with `ENV_ADMIN_USERNAME` and `ENV_ADMIN_PASSWORD` and authorize this
        operation only; they are never persisted and cannot be used at
        `/auth/login`.

        Creation is serialized in PostgreSQL and succeeds only while no users
        exist, preventing concurrent requests from creating multiple initial
        administrators. The selected password is bcrypt-hashed. The resulting
        account has role `admin`, an empty upload folder, and does not require
        TOTP. Usernames are trimmed and remain case-sensitive.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [bootstrapUsername, bootstrapPassword, username, password, confirmPassword]
              properties:
                bootstrapUsername:
                  type: string
                  minLength: 1
                  description: Deployment bootstrap username configured by the server.
                bootstrapPassword:
                  type: string
                  format: password
                  minLength: 1
                  description: Deployment bootstrap password; it is never stored in PostgreSQL.
                username:
                  type: string
                  minLength: 1
                  description: Permanent, case-sensitive administrator username. Surrounding whitespace is removed.
                password:
                  type: string
                  format: password
                  minLength: 12
                confirmPassword:
                  type: string
                  format: password
                  minLength: 12
                  description: Must exactly match `password`.
      responses:
        "201":
          description: Administrator created; setup HTML confirms completion.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid form values.
        "401":
          description: Invalid bootstrap credentials.
        "404":
          description: Setup is complete or frontend pages are disabled.
        "500":
          description: The administrator could not be hashed or persisted. The HTML response contains a generic error.
  /auth/login:
    post:
      tags: [Authentication]
      operationId: beginLogin
      summary: Log in with a password and optional TOTP
      description: |
        Accepts a JSON body of at most 1 MiB and rejects unknown fields. The
        username is trimmed and matched case-sensitively; the password is checked
        with bcrypt.

        The initial configured administrator receives a session cookie
        immediately and the response contains `authenticated: true`. Every
        subsequently created account receives an opaque challenge valid for five
        minutes. Managed accounts receive their TOTP provisioning URI when an
        administrator creates them. The login response exposes provisioning data
        only if an account has a pending, not-yet-active TOTP secret.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A TOTP challenge was created, or the initial administrator was authenticated immediately.
          headers:
            Set-Cookie:
              description: Set immediately for accounts exempt from TOTP.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
              examples:
                initialAdministrator:
                  summary: Password-only initial administrator
                  value:
                    authenticated: true
                totpChallenge:
                  summary: Existing TOTP-enabled account
                  value:
                    challengeToken: opaque-challenge-token
                enrollmentChallenge:
                  summary: First login for a managed account
                  value:
                    challengeToken: opaque-challenge-token
                    provisioningUri: otpauth://totp/PAL:user
                    secret: JBSWY3DPEHPK3PXP
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/verify:
    post:
      tags: [Authentication]
      operationId: verifyTOTP
      summary: Verify TOTP and create a session
      description: |
        Validates an unexpired challenge and a six-digit TOTP code. TOTP uses a
        30-second period, SHA-1, six digits, and accepts one adjacent time step in
        either direction. For first-time login, successful verification promotes
        the pending secret to the account's active secret. The challenge is then
        deleted and cannot be reused.

        A successful response creates a server-side session valid for 30 days
        and sets the opaque HttpOnly session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTOTPRequest"
      responses:
        "200":
          description: Authenticated session created.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie named pal_medias_uploader_session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Get the current session
      description: Resolves the opaque session cookie and returns the current account. Expired, missing, or unknown sessions receive `401`.
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Delete the current session
      description: Requires a valid session, deletes it from the server, and expires the browser cookie. Reusing the deleted cookie receives `401`.
      responses:
        "204":
          description: Session deleted and cookie expired.
          headers:
            Set-Cookie:
              description: Expired pal_medias_uploader_session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
  /admin/config:
    get:
      tags: [Users]
      operationId: userConfigurationPage
      summary: Open the administrator configuration page
      description: Requires an administrator session. The embedded HTML page calls `/admin/users`; disabling frontend pages does not disable those JSON endpoints.
      responses:
        "200":
          description: User configuration HTML page.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Frontend pages are disabled.
  /admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: Returns every configured account ordered by username. `totpEnabled` reflects whether an active TOTP secret is stored.
      responses:
        "200":
          description: All configured users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a TOTP-enabled user
      description: |
        Accepts a JSON body of at most 1 MiB and rejects unknown fields. The
        username is trimmed and case-sensitive. Roles are trimmed and normalized
        to lowercase. Passwords are bcrypt-hashed.

        A regular user requires a non-empty relative upload folder. Nested paths
        such as `family/alice` are allowed, while absolute paths and parent
        traversal are rejected. Administrator folders are always cleared.

        The service generates a TOTP secret for every managed account, including
        additional administrators. The provisioning URI and PNG data URI are
        returned only in this creation response and should be delivered securely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created. The TOTP QR code is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me/folder:
    put:
      tags: [Users]
      operationId: setMyUploadFolder
      summary: Set the current regular user's upload folder
      description: |
        Available only to role `user`. The folder is trimmed, cleaned, and stored
        with forward slashes. It must be non-empty and relative, and cannot be
        `..` or begin with `../`. Changing it affects the destination of future
        completed uploads; it does not move existing media.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [uploadFolder]
              properties:
                uploadFolder:
                  type: string
                  examples: [family/alice]
      responses:
        "204":
          description: Folder updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /albums:
    get:
      tags: [Gallery]
      operationId: listAlbums
      summary: List the current user's albums
      description: |
        Returns only albums owned by the current user. Item counts include media
        that is still accessible and not trashed. Results are ordered by manual
        position and then newest creation time. Automatic albums without a
        manual position therefore remain ordered by creation time.
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring search across album title, description, and member filenames.
          schema:
            type: string
      responses:
        "200":
          description: User-owned albums containing currently accessible media.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Gallery]
      operationId: createAlbum
      summary: Create an album owned by the current user
      description: Creates a manual album. The title and description are trimmed; a blank title is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumInput"
      responses:
        "201":
          description: Album created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400":
          $ref: "#/components/responses/BadRequest"
  /albums/order:
    patch:
      tags: [Gallery]
      operationId: reorderAlbums
      summary: Set the current user's album display order
      description: |
        Assigns sequential display positions to the listed manual albums in one
        transaction. Every listed album must belong to the current user.
        Automatic albums cannot be reordered. A failure leaves all positions
        unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [albumIds]
              properties:
                albumIds:
                  type: array
                  description: Manual album UUIDs in the desired relative order.
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Album order updated.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /albums/{albumId}:
    parameters:
      - $ref: "#/components/parameters/AlbumID"
    get:
      tags: [Gallery]
      operationId: getAlbum
      summary: Get an owned album and its currently accessible media
      description: |
        Returns an album owned by the current user and its active media. Shared
        media disappears from this response when the owner removes the share or
        trashes the item. An album owned by another user is reported as `404`.
      responses:
        "200":
          description: Album detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [Gallery]
      operationId: updateAlbum
      summary: Update an owned album
      description: Updates the trimmed title and description of a manual album. Automatic albums are system-managed and cannot be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumInput"
      responses:
        "204":
          description: Album updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    delete:
      tags: [Gallery]
      operationId: deleteAlbum
      summary: Delete an owned album without deleting its media
      description: Deletes a manual album and its membership links. Media files and media records are not deleted. Automatic albums cannot be deleted.
      responses:
        "204":
          description: Album deleted.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /albums/{albumId}/media:
    post:
      tags: [Gallery]
      operationId: addAlbumMedia
      summary: Add owned or shared media to an owned album
      description: |
        Adds all listed media in one transaction. The album must be manual and
        owned by the current user. Every media item must be active and either
        owned by or shared with that user. Existing membership is ignored, so
        repeating an ID is idempotent. Any inaccessible ID rejects the complete
        operation.
      parameters:
        - $ref: "#/components/parameters/AlbumID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumMediaInput"
      responses:
        "204":
          description: Accessible media added.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /albums/{albumId}/media/{id}:
    delete:
      tags: [Gallery]
      operationId: removeAlbumMedia
      summary: Remove media from an owned album
      description: Removes media from a manual album owned by the current user. Removing the current cover also clears `coverMediaId`.
      parameters:
        - $ref: "#/components/parameters/AlbumID"
        - $ref: "#/components/parameters/UploadID"
      responses:
        "204":
          description: Media removed from the album.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /albums/{albumId}/cover:
    patch:
      tags: [Gallery]
      operationId: setAlbumCover
      summary: Set an accessible album member as the cover
      description: The selected media must already belong to the album, remain active, and be accessible to the album owner.
      parameters:
        - $ref: "#/components/parameters/AlbumID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId:
                  type: string
                  pattern: "^[0-9a-f]{32}$"
                  description: Completed upload identifier of an existing album member.
      responses:
        "204":
          description: Cover updated.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: List owned and shared media
      description: |
        In normal mode, returns active media owned by or shared with the current
        user. In trash mode, returns only trashed media owned by the current user;
        recipients never see an owner's trash. Favorite state is resolved for
        the requesting user, not globally.
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring search over filename and MIME type.
          schema:
            type: string
        - name: kind
          in: query
          description: Filter by media kind. MIME types beginning with `video/` are videos; every other MIME type is treated as a photo.
          schema:
            type: string
            enum: [photo, video]
        - name: sort
          in: query
          description: Sort by completion time or filename-derived title.
          schema:
            type: string
            enum: [newest, oldest, title]
            default: newest
        - name: trash
          in: query
          description: When true, lists only the current user's trashed media.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Accessible completed media.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"
        "403":
          $ref: "#/components/responses/Forbidden"
  /media/files/{id}/favorite:
    patch:
      tags: [Gallery]
      operationId: setFavorite
      summary: Set the current user's favorite state for accessible media
      description: Creates or updates a per-user preference. The media must be active and owned by or shared with the current user.
      parameters:
        - $ref: "#/components/parameters/UploadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        "204":
          description: Personal favorite state updated.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /media/files/{id}:
    delete:
      tags: [Gallery]
      operationId: trashMedia
      summary: Move owned media to trash
      description: Soft-deletes owned active media. It immediately disappears from recipients, downloads, normal listings, and album results.
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "204":
          description: Media moved to trash and hidden from recipients.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /media/files/{id}/restore:
    patch:
      tags: [Gallery]
      operationId: restoreMedia
      summary: Restore owned media from trash
      description: Clears the owner's soft-delete timestamp, restoring previous shares and album visibility where those links still exist.
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "204":
          description: Media restored.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /media/files/{id}/permanent:
    delete:
      tags: [Gallery]
      operationId: permanentlyDeleteMedia
      summary: Permanently delete an owned media file and all associations
      description: |
        Deletes the physical file and then removes the owned media record.
        Database cascades remove album membership and personal preferences for
        that item. The owner's library-share relationships remain active for
        their other current and future media. A missing file is tolerated.
        Filesystem deletion failures return `502` and prevent successful
        completion.
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "204":
          description: Media permanently deleted.
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "502":
          description: The physical media file could not be deleted.
  /storage:
    get:
      tags: [Gallery]
      operationId: getStorage
      summary: Get totals for media accessible to the current user
      description: Counts and sums active media owned by or shared with the current user. Shared bytes are included; trashed media is excluded.
      responses:
        "200":
          description: User-scoped media totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /media/files/{id}/download:
    get:
      tags: [Media]
      operationId: downloadMedia
      summary: Download owned or shared media
      description: Returns an active media file only when the current user owns it or has a share. Filesystem paths are constrained to the configured media root.
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200":
          description: Media bytes.
          headers:
            Content-Disposition:
              description: Attachment disposition containing the stored filename.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/UploadNotFound"
  /media/files/{id}/shares:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    post:
      tags: [Media]
      operationId: shareMedia
      summary: Share owned media with a regular user
      description: |
        Creates a library-wide share from the current user to the target user.
        The path media ID is used to verify that the current user owns active
        media; the grant is not limited to that item. The recipient immediately
        gains access to all of the owner's current active media, and future
        uploads become accessible without another share request.

        Shared media contributes to the recipient's lists, downloads, manual
        albums, favorites, storage totals, and next nightly automatic-album
        reconciliation. The target must be another regular user; administrators
        and the owner cannot be recipients. Repeating the relationship is
        idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareRequest"
      responses:
        "204":
          description: Library share added or already present.
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Media]
      operationId: unshareMedia
      summary: Remove a library share
      description: |
        Removes the owner-to-recipient relationship represented by the owned
        media ID. All media belonging to that owner immediately becomes
        inaccessible to the recipient. It disappears from lists, downloads,
        storage totals, and album responses; future uploads are no longer shared.
        Ownership and the owner's albums are unchanged. Legacy clients may still
        send the username JSON body, but new clients should use the query
        parameter.
      parameters:
        - name: username
          in: query
          required: true
          description: Case-sensitive username of the regular-user recipient to remove.
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Library share removed.
        "400":
          $ref: "#/components/responses/BadRequest"
  /media/upload:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Create an upload session
      description: |
        Creates a resumable upload owned by the authenticated regular user. The
        account must have a non-empty upload folder. Administrators cannot upload.

        The JSON request body is limited to 64 KiB and unknown fields are
        rejected. Both `/` and `\` path components are removed from `filename`;
        validation applies to the resulting basename. The optional client
        checksum must be 64 hexadecimal characters. The declared size must not
        exceed `ENV_MAX_UPLOAD_SIZE_BYTES` (100 GiB by default).

        The response reports the fixed 8 MiB part size and total part count.
        Upload metadata is persisted under the temporary directory, allowing an
        active session and its uploaded parts to survive a server restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
        "400":
          $ref: "#/components/responses/UploadBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /media/upload/{id}:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    get:
      tags: [Uploads]
      operationId: getUploadStatus
      summary: Get uploaded parts
      description: Returns an active upload owned by the current user and scans its temporary directory for completed part files. `uploaded_parts` is `null` until the first part exists.
      responses:
        "200":
          description: Active upload status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/UploadNotFound"
    delete:
      tags: [Uploads]
      operationId: deleteUpload
      summary: Cancel and delete an upload
      description: Deletes temporary metadata and all uploaded parts, then removes the active session. Completed media cannot be deleted through this endpoint.
      responses:
        "200":
          description: Upload deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /media/upload/{id}/parts/{part}:
    put:
      tags: [Uploads]
      operationId: uploadPart
      summary: Upload or replace one part
      description: |
        Uploads raw bytes for a zero-indexed part owned by the current user.
        Every non-final part must contain exactly 8,388,608 bytes. The final
        part must contain exactly `size - part * 8,388,608` bytes. The server
        reads at most one byte beyond the expected length to detect oversized
        bodies.

        Data is first written and synced to a temporary file and then atomically
        renamed to the part path. A short, oversized, or interrupted write does
        not replace a previously valid part. Repeating a valid part intentionally
        replaces it.
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/PartNumber"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Part stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartResponse"
        "400":
          $ref: "#/components/responses/UploadBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /media/upload/{id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Assemble and persist an upload
      description: |
        Verifies that every expected part exists, then concatenates parts in
        numeric order while computing SHA-256. The assembled byte count must
        match the declared size. When the upload supplied a client checksum, it
        is compared case-insensitively with the computed digest.

        The final relative path is
        `{uploadFolder}/YYYY/MM/{uploadId}_{filename}`. Completion creates parent
        directories, atomically moves the assembled file, persists the media
        record, and removes temporary chunks and active-session metadata. The
        returned lowercase SHA-256 is always computed by the server. Missing
        parts return `409`; size or checksum mismatches return `400`.
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200":
          description: Upload completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadResponse"
        "400":
          $ref: "#/components/responses/UploadBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/MissingPart"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pal_medias_uploader_session
      description: |
        Opaque session token stored only as a hash by the server. It is issued
        after successful TOTP verification, or immediately for the initial
        administrator, and expires after 30 days. Browser cookies are HttpOnly,
        use path `/`, and are Secure whenever the request is HTTPS.
  parameters:
    AlbumID:
      name: albumId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User-owned album UUID. Inaccessible album IDs are reported as not found.
    UploadID:
      name: id
      in: path
      required: true
      description: 32-character lowercase hexadecimal identifier shared by an upload session and its completed media record.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    PartNumber:
      name: part
      in: path
      required: true
      description: Zero-indexed part number; must be less than the upload's chunk count.
      schema:
        type: integer
        format: int64
        minimum: 0
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          description: Case-sensitive username. Surrounding whitespace is ignored.
          examples: [admin]
        password:
          type: string
          format: password
          minLength: 1
          description: Plaintext password transported over HTTPS and checked with bcrypt.
    LoginChallenge:
      type: object
      additionalProperties: false
      description: Exactly one shape is returned, immediate authentication or a TOTP challenge.
      oneOf:
        - required: [authenticated]
          properties:
            authenticated:
              const: true
        - required: [challengeToken]
      properties:
        challengeToken:
          type: string
          minLength: 1
          description: Opaque challenge valid for five minutes.
        provisioningUri:
          type: string
          format: uri
          description: Present only while a managed account requires initial TOTP enrollment.
        secret:
          type: string
          pattern: "^[A-Z2-7]+=*$"
          description: Base32 TOTP secret present only during initial enrollment. Store it securely.
        authenticated:
          type: boolean
          description: True only when password login immediately created a session for the initial administrator.
    VerifyTOTPRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[0-9]{6}$"
    AuthenticatedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: authenticated
    SessionResponse:
      type: object
      additionalProperties: false
      required: [id, username, role, uploadFolder, totpEnabled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        uploadFolder:
          type: string
          description: Relative upload destination for regular users; empty for administrators.
        totpEnabled:
          type: boolean
          description: True when the account has an active TOTP secret.
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, totpEnabled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          description: Unique, case-sensitive login name.
        role:
          type: string
          enum: [admin, user]
        uploadFolder:
          type: string
          description: Relative media destination. Empty for administrators.
        totpEnabled:
          type: boolean
          description: Whether an active TOTP secret is stored for this account.
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          type: string
          minLength: 1
          description: Unique, case-sensitive username; surrounding whitespace is removed.
        password:
          type: string
          format: password
          minLength: 12
        role:
          type: string
          enum: [admin, user]
          description: Trimmed and normalized to lowercase by the server.
        uploadFolder:
          type: string
          description: Required for regular users and ignored for administrators. Must be relative and cannot contain parent traversal.
    CreateUserResponse:
      type: object
      additionalProperties: false
      required: [user, provisioningUri, qrCode]
      properties:
        user:
          $ref: "#/components/schemas/User"
        provisioningUri:
          type: string
          format: uri
          description: Authenticator provisioning URI returned only when the account is created.
        qrCode:
          type: string
          pattern: "^data:image/png;base64,"
          description: PNG data URI for one-time TOTP setup, returned only when the account is created.
    ShareRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          description: Case-sensitive username of a regular-user recipient.
    AlbumInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          description: Album title after trimming; blank values are rejected.
        description:
          type: string
          description: Optional description; surrounding whitespace is removed.
    AlbumMediaInput:
      type: object
      additionalProperties: false
      required: [mediaIds]
      properties:
        mediaIds:
          type: array
          description: Completed upload IDs. Every item must be active and accessible. An empty list is a successful no-op.
          items:
            type: string
            pattern: "^[0-9a-f]{32}$"
    Album:
      type: object
      additionalProperties: false
      required: [id, ownerId, title, description, automatic, createdAt, itemCount]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        automatic:
          type: boolean
          description: True for a nightly managed weekly album or a daily album created when a date has more than 15 active items.
        createdAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          format: int64
          minimum: 0
          description: Count of active album members still accessible to the owner.
        coverMediaId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Optional completed-upload ID selected from current album membership.
        media:
          type: array
          description: Present on album-detail responses and omitted from album-list responses when empty.
          items:
            $ref: "#/components/schemas/Media"
    Media:
      type: object
      additionalProperties: false
      required: [id, ownerId, ownerUsername, title, kind, favorite, fileName, mimeType, fileSize, sha256, createdAt, shared]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Original completed upload identifier.
        ownerId:
          type: string
          format: uuid
        ownerUsername:
          type: string
        title:
          type: string
          description: Display title derived from the filename by removing its final extension.
        kind:
          type: string
          enum: [photo, video]
          description: "`video` when MIME type starts with `video/`; otherwise `photo`."
        favorite:
          type: boolean
          description: Personal state for the current user.
        fileName:
          type: string
          description: Sanitized basename supplied when the upload was created.
        mimeType:
          type: string
        fileSize:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Lowercase digest computed by the server during completion.
        createdAt:
          type: string
          format: date-time
          description: Upload completion timestamp used for gallery ordering and automatic album dates.
        shared:
          type: boolean
          description: True when the current user is a recipient rather than the owner.
        deletedAt:
          type: string
          format: date-time
          description: Present only for owner trash listings.
    Storage:
      type: object
      additionalProperties: false
      required: [totalBytes, photoBytes, videoBytes, photoCount, videoCount]
      properties:
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        photoBytes:
          type: integer
          format: int64
          minimum: 0
        videoBytes:
          type: integer
          format: int64
          minimum: 0
        photoCount:
          type: integer
          format: int64
          minimum: 0
        videoCount:
          type: integer
          format: int64
          minimum: 0
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, size]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Directory components using `/` or `\` are removed; the resulting basename must be 1-255 characters and cannot be `.` or `..`.
          examples: [video.mp4]
        mime_type:
          type: string
          maxLength: 255
          description: Informational media type used to derive photo/video kind. Content sniffing is not performed.
          examples: [video/mp4]
        size:
          type: integer
          format: int64
          minimum: 1
          description: Total media size in bytes; maximum is configured by the server.
        sha256:
          type: string
          pattern: "^[0-9A-Fa-f]{64}$"
          description: Optional case-insensitive client SHA-256 used to verify the assembled file.
    CreateUploadResponse:
      type: object
      additionalProperties: false
      required: [id, chunk_size, chunks]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        chunk_size:
          type: integer
          format: int64
          const: 8388608
        chunks:
          type: integer
          format: int64
          minimum: 1
    UploadPartResponse:
      type: object
      additionalProperties: false
      required: [upload_id, part, size]
      properties:
        upload_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        part:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 1
    UploadStatusResponse:
      type: object
      additionalProperties: false
      required: [id, filename, size, chunks, uploaded_parts]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        filename:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
        chunks:
          type: integer
          format: int64
          minimum: 1
        uploaded_parts:
          description: Uploaded zero-indexed parts discovered on disk; null when no parts exist yet.
          type: [array, "null"]
          items:
            type: integer
            format: int64
            minimum: 0
    CompleteUploadResponse:
      type: object
      additionalProperties: false
      required: [status, media_path, size, sha256]
      properties:
        status:
          type: string
          const: completed
        media_path:
          type: string
          description: Relative path formatted as {user-folder}/YYYY/MM/{upload-id}_{filename}.
        size:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    DeleteUploadResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: deleted
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Stable or human-readable error message. Clients should primarily branch on HTTP status.
  responses:
    BadRequest:
      description: Malformed JSON or unknown authentication request field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            malformed:
              value:
                error: Bad Request
    UploadBadRequest:
      description: Invalid upload metadata, part number, part size, final size, or checksum.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidPart:
              value:
                error: invalid part
            checksumMismatch:
              value:
                error: SHA-256 mismatch
    Unauthorized:
      description: Missing or invalid session, credentials, challenge, or TOTP code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                error: Unauthorized
    ForbiddenOrigin:
      description: The Origin header is not in the comma-separated `ENV_CORS_ALLOWED_ORIGINS` allowlist. Response has no body.
    Forbidden:
      description: The authenticated account does not have the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UploadNotFound:
      description: Upload does not exist or is no longer active.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                error: upload not found
    ResourceNotFound:
      description: The resource does not exist, is not owned by the current user, or is otherwise inaccessible. This avoids disclosing another user's resources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MissingPart:
      description: At least one expected upload part is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingPart:
              value:
                error: missing part 2
    InternalServerError:
      description: Unexpected filesystem, database, token generation, or encoding failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                error: internal server error
